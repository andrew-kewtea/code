name: Pytest

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      # 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # Python 설치
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 의존성 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # pytest 특정 폴더만 실행 (예: tests/unit)
      - name: Run Pytest
        run: |
          pytest tests/unit #지정된 경로만 테스트
