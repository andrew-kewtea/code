# .github/workflows/release-docker-publish.yml

name: Release & Publish Docker Image

on:
  release:
    types: [published]

jobs:
  docker_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        run: |
          docker buildx build \
            --tag docker.io/${{ secrets.DOCKERHUB_USER }}/myapp:${{ github.event.release.tag_name }} \
            --push .

      - name: Confirm push
        run: |
          echo "Published ${{ github.event.release.tag_name }} to DockerHub"
