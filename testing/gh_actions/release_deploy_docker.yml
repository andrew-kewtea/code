name: Deploy FastAPI on Release Tag

on:
  push:
    tags:
      - 'v*'   # release tag like v1.2.3

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Buildx 설치 (optional but recommended)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # (옵션) Docker 로그인 필요하면 추가
      # - name: Login to registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ...
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}

      # FastAPI 이미지 **subfolder Dockerfile** 명시적 빌드  (원래는 docker compose build )
      - name: Build FastAPI Docker image
        run: |
          docker build \
            -f ./docker/fastapi/Dockerfile \
            -t fastapi-app:${{ github.ref_name }} \
            ./docker/fastapi

      # 전체 compose 재시작 (traefik, mysql 등 포함)
      - name: Restart Compose services
        run: |
          cd ./docker
          docker compose down
          docker compose up -d

      # (선택) health check 
      - name: Service health check
        run: |
          sleep 10
          curl -fsSL http://localhost/health || exit 1
